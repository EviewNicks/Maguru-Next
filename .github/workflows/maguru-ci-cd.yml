name: Maguru CI/CD Pipeline

# Trigger saat push ke branch atau pull request
on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  # Scheduler untuk menjalankan tes secara berkala
  schedule:
    - cron: '0 0 * * 1' # Setiap hari Senin jam 00:00 UTC

# Menggunakan environment secrets
env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000

# Job yang akan dijalankan
jobs:
  # ===== Job 1: Validasi dan Linting =====
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Mengambil semua history untuk tools yang membutuhkannya

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn' # Mengaktifkan caching

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Keamanan: Melakukan audit dependencies
      - name: Security Audit
        run: yarn audit --groups dependencies --level high || true

      # Linting untuk memastikan kualitas kode
      - name: Lint Code
        run: yarn lint

      # Pengecekan format kode
      - name: Format Check
        run: yarn format:check || true

      # Validasi tipe TypeScript
      - name: TypeScript Check
        run: yarn tsc --noEmit

  # ===== Job 2: Unit & Integration Testing =====
  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest

    # Matrix testing untuk menjalankan pada Node versi berbeda
    strategy:
      matrix:
        node-version: [18.x]
        # Bisa ditambahkan versi lain jika perlu: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Cache node_modules untuk mempercepat build
      - name: Cache Yarn
        uses: actions/cache@v3
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Menjalankan unit test dengan coverage
      - name: Run Unit Tests
        run: yarn test

      # Upload hasil test coverage untuk analisis
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/

  # ===== Job 3: E2E Testing =====
  e2e-test:
    name: End-to-End Tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Batasi waktu eksekusi

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Install Playwright browsers
      - name: Install Playwright
        run: yarn playwright install --with-deps

      # Menjalankan E2E tests dengan Playwright
      - name: Run E2E Tests
        run: yarn test:e2e

      # Menyimpan hasil test jika gagal
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results/

  # ===== Job 4: Build =====
  build:
    name: Build Application
    needs: [test, e2e-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Menggunakan cache untuk mempercepat build
      - name: Cache Next.js Build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}

      # Build aplikasi
      - name: Build Application
        run: yarn vercel-build

      # Upload build artifacts
      - name: Upload Build
        uses: actions/upload-artifact@v5
        with:
          name: build-files
          path: .next/

  # ===== Job 5: Deploy ke Staging =====
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: staging # Menggunakan environment khusus staging

    steps:
      - uses: actions/checkout@v3

      - name: Download Build
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: .next

      # Menggunakan Railway untuk deployment
      - name: Deploy to Railway (Staging)
        uses: railway/railway-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          environment: staging
          service: maguru-backend
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  # ===== Job 6: Deploy ke Production =====
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production # Menggunakan environment untuk production

    steps:
      - uses: actions/checkout@v3

      - name: Download Build
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: .next

      # Deployment ke Vercel
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'
